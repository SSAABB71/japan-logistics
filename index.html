<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japan Logistics Watch</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#17263d;font:15px/1.65 system-ui,sans-serif}header{background:#14263e;color:white;padding:30px 6%}header small{letter-spacing:3px;color:#a8bdd5}h1{margin:5px 0;font-size:clamp(25px,5vw,42px)}main{max-width:1100px;margin:auto;padding:24px}section,article{background:white;border:1px solid #e0e5ed;border-radius:12px;padding:20px;margin-bottom:15px} .companies{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.company{border-top:5px solid var(--c);cursor:pointer;text-align:left;background:white;padding:16px;border-radius:10px;border-left:1px solid #ddd;border-right:1px solid #ddd;border-bottom:1px solid #ddd;color:inherit;font:inherit}.company strong{display:block;font-size:17px}input,select,button{font:inherit}input,select{padding:10px;border:1px solid #ccd5e2;border-radius:6px;max-width:100%}.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.filters input{flex:1}a{color:#245caa}h2{font-size:21px}h3{margin:0 0 10px} .muted{color:#62748a}footer{padding:20px;text-align:center;color:#62748a} .tag{background:#e9eff7;padding:3px 9px;border-radius:5px;font-size:12px}</style></head><body><header><small>DAILY INTELLIGENCE</small><h1>JAPAN LOGISTICS WATCH</h1>일본 특송 물류 4사 뉴스 및 정책 모니터링</header><main><section><h3>모니터링 현황</h3><p id="status" class="muted">뉴스 데이터 연결 준비 중 · 자동 업데이트 미설정</p><div class="companies" id="companies"></div></section><h2>뉴스 및 정책 브리핑</h2><div class="filters"><select id="corp"><option value="">전체 물류사</option></select><select id="date"><option value="">전체 날짜</option></select><select id="type"><option value="">전체 분류</option></select><input id="q" placeholder="기사 및 키워드 검색"></div><div id="news"></div><section><h3>공식 정보 확인</h3><p class="muted">각 물류사의 공식 홈페이지에서 최신 정보를 확인할 수 있습니다.</p><div id="links"></div></section></main><footer>JAPAN LOGISTICS WATCH · 한국시간 기준</footer><script>const companies=[['YAMATO','야마토운수','#e4b92f','https://www.kuronekoyamato.co.jp/'],['SAGAWA','사가와급편','#3267b5','https://www.sagawa-exp.co.jp/'],['JP POST','일본우편','#cc3844','https://www.post.japanpost.jp/'],['SEINO','세이노운수','#27835e','https://www.seino.co.jp/']];const $=id=>document.getElementById(id);let data=[];function el(tag,txt){const x=document.createElement(tag);x.textContent=txt;return x}function opt(id,v,t){const o=el('option',t);o.value=v;$(id).append(o)}companies.forEach(([id,name,c,url])=>{opt('corp',id,name);const b=el('button','');b.className='company';b.style.setProperty('--c',c);b.append(el('strong',id),el('span',name));b.onclick=()=>{$('corp').value=$('corp').value===id?'':id;render()};$('companies').append(b);const a=el('a',name+' 공식 홈페이지');a.href=url;a.target='_blank';a.rel='noopener';const p=el('p','');p.append(a);$('links').append(p)});function render(){const n=$('news');n.replaceChildren();const filtered=data.filter(a=>(!$('corp').value||a.company===$('corp').value)&&(!$('date').value||a.date===$('date').value)&&(!$('type').value||a.type===$('type').value)&&JSON.stringify(a).toLowerCase().includes($('q').value.toLowerCase()));if(!filtered.length){const s=el('section',data.length?'조건에 맞는 뉴스가 없습니다.':'아직 연결된 뉴스 데이터가 없습니다. 다음 단계에서 자동 수집을 연결합니다.');n.append(s)}filtered.forEach(a=>{const card=el('article','');const tag=el('span',[a.date,a.company,a.type].filter(Boolean).join(' · '));tag.className='tag';card.append(tag,el('h2',a.title||''),el('p',a.summary||''));if(a.effective)card.append(el('p','시행일: '+a.effective));if(a.impact)card.append(el('p','실무 영향: '+a.impact));if(/^https?:\/\//i.test(a.url||'')){const l=el('a','일본어 원문 보기');l.href=a.url;l.target='_blank';l.rel='noopener';card.append(l)}n.append(card)})}['corp','date','type','q'].forEach(id=>$(id).addEventListener('input',render));render();fetch('news.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=Array.isArray(d)?d:d.articles||[];data.sort((a,b)=>String(b.date).localeCompare(String(a.date)));[...new Set(data.map(a=>a.date).filter(Boolean))].forEach(v=>opt('date',v,v));[...new Set(data.map(a=>a.type).filter(Boolean))].forEach(v=>opt('type',v,v));$('status').textContent=data.length?'등록 기사 '+data.length+'건 · 최신 기사 '+data[0].date:'등록된 기사 없음';render()}).catch(()=>{});</script></body></html>
